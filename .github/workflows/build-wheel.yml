# Builds the SageAttention wheel that lun/watermark-remover installs, and publishes it as a release asset.
# It sits on the fork's default branch only because workflow_dispatch requires that; it builds the commit given
# in `ref`, so the fork's own branches never need to diverge from upstream.
# The recipe is the build stage watermark-remover's Dockerfile used to run on every cold build, so the wheel is
# the same artifact, built once.
name: Build wheel

on:
  workflow_dispatch:
    inputs:
      ref:
        description: SageAttention commit to build
        default: d1a57a546c3d395b1ffcbeecc66d81db76f3b4b5
      torch:
        description: torch the wheel is built against (its ABI must match the runtime torch exactly)
        default: 2.13.0+cu130
      torch_index:
        description: pip index for that torch
        default: https://download.pytorch.org/whl/cu130
      cuda_image:
        description: CUDA devel image with nvcc (Ubuntu 24.04's python3 is 3.12, matching python:3.12)
        default: nvidia/cuda:13.0.2-devel-ubuntu24.04
      arch_list:
        description: TORCH_CUDA_ARCH_LIST (12.0 = RTX PRO 6000 Blackwell, 8.9 = L4)
        default: '8.9;12.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Inputs reach the shell as env vars, never interpolated into the script.
    env:
      REF: ${{ inputs.ref }}
      TORCH: ${{ inputs.torch }}
      TORCH_INDEX: ${{ inputs.torch_index }}
      CUDA_IMAGE: ${{ inputs.cuda_image }}
      ARCH_LIST: ${{ inputs.arch_list }}
    steps:
      # The CUDA devel image + torch + the build tree don't fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src

      - name: Build wheel
        run: |
          mkdir -p wheels
          docker run --rm -v "$PWD/src:/src" -v "$PWD/wheels:/wheels" \
            -e TORCH -e TORCH_INDEX -e TORCH_CUDA_ARCH_LIST="$ARCH_LIST" \
            "$CUDA_IMAGE" bash -euo pipefail -c '
              apt-get update && apt-get install -y --no-install-recommends python3 python3-dev python3-venv git
              git config --global --add safe.directory /src
              python3 -m venv /venv
              /venv/bin/pip install --no-cache-dir "torch==$TORCH" --index-url "$TORCH_INDEX"
              /venv/bin/pip install --no-cache-dir setuptools wheel ninja packaging
              cd /src
              # A hosted runner has 4 vCPU / 16 GB: far fewer parallel nvcc jobs than the 8x4 the GPU host used,
              # or the compiler gets OOM-killed. Slower, but it only runs once per torch/CUDA bump.
              MAX_JOBS=2 EXT_PARALLEL=1 NVCC_APPEND_FLAGS="--threads 2" \
                /venv/bin/pip wheel --no-build-isolation --no-deps -w /wheels .
            '
          sudo chown -R "$(id -u):$(id -g)" wheels
          ls -la wheels

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd wheels
          sha256sum ./*.whl | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
          # e.g. sage-d1a57a546c3d-torch2.13.0-cu130-sm89-sm120
          arch="sm$(echo "$ARCH_LIST" | tr -d . | sed 's/;/-sm/g')"
          tag="sage-${REF:0:12}-torch${TORCH/+/-}-${arch}"
          gh release create "$tag" ./*.whl SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REF" \
            --title "$tag" \
            --notes "SageAttention ${REF} built against torch ${TORCH} (${TORCH_INDEX}), TORCH_CUDA_ARCH_LIST=${ARCH_LIST}, in ${CUDA_IMAGE}. Install with pip --no-deps into the matching torch; verify against SHA256SUMS."
